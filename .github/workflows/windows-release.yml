name: Signed Windows release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-build.lock.txt

      - name: Require the publisher signing certificate
        shell: pwsh
        env:
          HELM_SIGNING_CERTIFICATE_BASE64: ${{ secrets.HELM_SIGNING_CERTIFICATE_BASE64 }}
          HELM_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.HELM_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:HELM_SIGNING_CERTIFICATE_BASE64) -or
              [string]::IsNullOrWhiteSpace($env:HELM_SIGNING_CERTIFICATE_PASSWORD)) {
            throw "Set HELM_SIGNING_CERTIFICATE_BASE64 and HELM_SIGNING_CERTIFICATE_PASSWORD before publishing a release."
          }
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+\.\d+\.\d+)$') {
            throw "Release tags must use vMAJOR.MINOR.PATCH, for example v1.2.3."
          }
          $certPath = Join-Path $env:RUNNER_TEMP "helm-publisher.pfx"
          [IO.File]::WriteAllBytes($certPath, [Convert]::FromBase64String($env:HELM_SIGNING_CERTIFICATE_BASE64))
          "HELM_CERT_PATH=$certPath" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HELM_RELEASE_VERSION=$($Matches.version)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "HELM_MSIX_VERSION=$($Matches.version).0" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install core build dependencies
        run: python -m pip install --require-hashes -r requirements-build.lock.txt

      - name: Build standalone app
        run: python scripts/build_standalone.py --clean

      - name: Pack and sign MSIX
        shell: pwsh
        env:
          HELM_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.HELM_SIGNING_CERTIFICATE_PASSWORD }}
        run: |
          ./scripts/build_msix.ps1 -Version $env:HELM_MSIX_VERSION -SkipBuildExe -CertPath $env:HELM_CERT_PATH -CertPassword $env:HELM_SIGNING_CERTIFICATE_PASSWORD

      - name: Generate release WinGet manifest
        shell: pwsh
        run: |
          $assetUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/Helm.msix"
          python scripts/generate_winget_manifest.py --artifact dist/Helm.msix --version $env:HELM_RELEASE_VERSION --url $assetUrl --output dist/Helm.yaml

      - name: Publish signed artifacts and checksums
        uses: softprops/action-gh-release@v2
        with:
          name: Helm ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/Helm.msix
            dist/Helm.msix.sha256
            dist/Helm.yaml
            dist/Helm.sha256

      - name: Remove signing certificate from runner
        if: always()
        shell: pwsh
        run: |
          if ($env:HELM_CERT_PATH -and (Test-Path -LiteralPath $env:HELM_CERT_PATH)) {
            Remove-Item -LiteralPath $env:HELM_CERT_PATH -Force
          }
