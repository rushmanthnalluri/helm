name: Windows clean-checkout build

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12.10"
          cache: pip
          cache-dependency-path: requirements-build.lock.txt

      - name: Install core build dependencies
        run: python -m pip install --require-hashes -r requirements-build.lock.txt

      - name: Build standalone app from clean checkout
        run: python scripts/build_standalone.py --clean

      - name: Upload build and checksums
        uses: actions/upload-artifact@v4
        with:
          name: helm-windows-${{ github.sha }}
          path: |
            dist/Helm/
            dist/Helm.sha256
          if-no-files-found: error
          retention-days: 14
